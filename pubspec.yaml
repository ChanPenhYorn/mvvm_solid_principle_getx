name: getx_mvvm_architecture
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.5.1
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.2
  firebase_crashlytics: ^5.0.2
  package_info_plus: ^8.3.0
  flutter_svg: ^2.0.17
  flutter_flavorizr: ^2.4.1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0     

flutter:
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/svg/
    - assets/images/

  

flavorizr:
  ide: "vscode"
  flavors:
    dev:
      app:
        name: "Dev App"
      android:
        applicationId: "com.solid.principle.dev"
        icon: "assets/images/app_logo_dev.png"
        packageName: "com.solid.principle.dev"
        resValues:
          variable_one:
            type: "string"
            value: "example variable one"
          variable_two:
            type: "string"
            value: "example variable two"

        firebase:
          config: ".firebase/dev/android/google-services.json"
        
      ios:
        bundleId: "com.solid.principle.dev" 
        icon: "assets/images/app_logo_dev.png"
        firebase:
          config: ".firebase/dev/ios/GoogleService-Info.plist"


    staging:
      app:
        name: "Staging App"
      android:
        applicationId: "com.solid.principle.staging"
        icon: "assets/images/app_logo_staging.png"
        packageName: "com.solid.principle.staging"
        resValues:
          variable_one:
            type: "string"
            value: "example variable one"
          variable_two:
            type: "string"
            value: "example variable two"
        firebase:
          config: ".firebase/staging/android/google-services.json"
 
      ios:
        bundleId: "com.solid.principle.staging"
        icon: "assets/images/app_logo_staging.png"
        firebase:
          config: ".firebase/staging/ios/GoogleService-Info.plist"

        
    prod:
      app:
        name: "Prod App"
      android:
        applicationId: "com.solid.principle"
        icon: "assets/images/app_logo.png"
        packageName: "com.solid.principle"
        resValues:
          variable_one:
            type: "string"
            value: "example variable one"
          variable_two:
            type: "string"
            value: "example variable two"
        firebase:
          config: ".firebase/prod/android/google-services.json"
      ios:
        bundleId: "com.solid.principle"
        icon: "assets/images/app_logo.png"
        firebase:
          config: ".firebase/prod/ios/GoogleService-Info.plist"
